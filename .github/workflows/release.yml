name: release

# GitHub で Release を publish した時点で、zip を作って添付し、
# VPM のリスティング（index.json）を作り直して Pages に出す。
#
# 「main への push で自動リリース」にはしていない。ワークフローが
# GITHUB_TOKEN で作った Release は release イベントを発火させないため、
# その形にすると登録側が一生走らない。リリースを切るのは人の操作にして、
# そこから先を全部自動にしている。
#
# 手順:
#   1. package.json の version を上げて main に push
#   2. GitHub で「Draft a new release」→ タグ v<version> を新規作成 → Publish
#   3. あとはここが zip の添付とリスティングの更新までやる
#
# workflow_dispatch は「リリースは増やさずリスティングだけ出し直す」用。
# Pages の設定を入れた直後などに使う。
on:
  release:
    types: [published]
  workflow_dispatch:

# 既定は何も渡さない。必要なものをジョブごとに足す。
#
# permissions を書いた時点で、書かなかったスコープは none になる
# （metadata の read だけが常に残る）。リポジトリの Settings 側で
# 「Workflow permissions」を Read and write に変える必要は無い。
permissions: {}

# 添付と Pages の書き込みが重なると、古い index.json が後から乗る。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  assets:
    # workflow_dispatch のときは添えるリリースが無いので回さない。
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # Release にアセットを足すため。ここ以外に書き込む先は無い。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Release のタグの中身を固める。main の先端ではない
          # （タグを打ってから main が進んでいても、配るものはタグと一致させる）。
          ref: ${{ github.event.release.tag_name }}

      - name: タグと package.json を突き合わせる
        id: package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          NAME=$(jq -r .name package.json)
          VERSION=$(jq -r .version package.json)

          if [ "$TAG" != "v$VERSION" ]; then
            echo "タグ ($TAG) と package.json の version ($VERSION) が食い違っています。" >&2
            echo "タグは v<version> の形にしてください。" >&2
            exit 1
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$NAME-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: zip を作る
        env:
          TAG: ${{ github.event.release.tag_name }}
          ZIP: ${{ steps.package.outputs.zip }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p build/pkg build/out

          # zip の中身はパッケージのルートそのもの。VPM は展開したものを
          # Packages/<name>/ にそのまま置く（1 段包むと壊れる）。
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='build' \
            ./ build/pkg/

          # url は必ずここで確定させる。手で書いた値がずれていても、
          # 配るものと指し先が食い違わないようにする。
          URL="https://github.com/$REPO/releases/download/$TAG/$ZIP"
          jq --arg url "$URL" '.url = $url' build/pkg/package.json > build/pkg/package.json.tmp
          mv build/pkg/package.json.tmp build/pkg/package.json

          (cd build/pkg && zip -q -r "../out/$ZIP" .)

          # zipSHA256 は zip の中には入れない（自分自身のハッシュになってしまう）。
          # リリースに添える package.json とリスティングだけが持つ。
          SHA=$(sha256sum "build/out/$ZIP" | cut -d' ' -f1)
          jq --arg sha "$SHA" '.zipSHA256 = $sha' build/pkg/package.json > build/out/package.json

          echo "$ZIP $SHA"

      - name: 中身を確かめる
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          LIST=$(unzip -Z1 "build/out/$ZIP")

          # ルートに package.json が無い zip を配ると、VCC は入れたあとで壊れる
          echo "$LIST" | grep -qx './package.json' || echo "$LIST" | grep -qx 'package.json' \
            || (echo "zip のルートに package.json がありません" && exit 1)

          echo "$LIST" | grep -q 'Editor/' \
            || (echo "Editor/ が入っていません" && exit 1)

          if echo "$LIST" | grep -qE '(^|/)\.git(/|$)'; then
            echo ".git が混ざっています"
            exit 1
          fi

      - name: Release に添付する
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          # --clobber を付けておく。ワークフローを回し直したときに
          # 「既にある」で止まらないように。
          gh release upload "$TAG" \
            "build/out/$ZIP" \
            "build/out/package.json" \
            --clobber

  listing:
    needs: assets
    # workflow_dispatch では assets を飛ばすので、skipped でも進める。
    # 添付に失敗したときだけは出さない（zip の無いリリースを載せないため）。
    if: always() && needs.assets.result != 'failure' && needs.assets.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      # チェックアウトと、Release 一覧を読むため
      contents: read
      # Pages への公開と、その OIDC 認証のため
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/configure-pages@v5
        id: pages

      - name: index.json を組み立てる
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node .github/scripts/build-listing.mjs out

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - uses: actions/deploy-pages@v4
        id: deploy
